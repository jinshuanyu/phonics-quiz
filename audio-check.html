<script>
let cur=null;
function play(btn){return new Promise(res=>{ if(cur){cur.pause();} document.querySelectorAll(".playing").forEach(b=>b.classList.remove("playing"));
  const a=new Audio(btn.dataset.src); cur=a; btn.classList.add("playing");
  const done=()=>{btn.classList.remove("playing");res();}; a.onended=done; a.onerror=done; a.play().catch(done); });}
document.querySelectorAll("button.w").forEach(b=>b.onclick=()=>play(b));
document.querySelectorAll("button.all").forEach(b=>b.onclick=async()=>{ for(const w of b.parentNode.querySelectorAll("button.w")){ await play(w); } });
